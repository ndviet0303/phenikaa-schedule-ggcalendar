name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build release zip
        run: |
          mkdir -p dist release
          cp -r src manifest.json README.md dist/
          cd dist && zip -r ../release/phenikaa-schedule-${{ github.ref_name }}.zip ./* && cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/phenikaa-schedule-${{ github.ref_name }}.zip
          name: Phenikaa Schedule Dispatcher ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
