<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Phenikaa Schedule Dispatcher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../ui/popup.css">
</head>
<body>
  <header>
    <div class="brand-wrap">
      <div class="brand-mark">Z</div>
      <span class="brand-name">Schedule Dispatcher</span>
    </div>
    <div class="header-actions">
      <span class="tag-status">Chờ kết nối</span>
      <button id="btnThemeToggle" class="btn-theme-toggle" title="Đổi giao diện Sáng / Tối">
        <svg id="iconSun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="iconMoon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <!-- DATE SELECTION -->
    <div class="date-grid">
      <div class="date-field">
        <label class="field-label">Từ ngày</label>
        <div class="date-input-wrap">
          <svg class="date-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <input type="date" id="popStart" class="court-date-input" />
        </div>
      </div>
      <div class="date-field">
        <label class="field-label">Đến ngày</label>
        <div class="date-input-wrap">
          <svg class="date-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <input type="date" id="popEnd" class="court-date-input" />
        </div>
      </div>
    </div>

    <!-- QUICK WEEK CHIPS -->
    <div class="chips-carousel">
      <div class="court-chip active" id="chipThisWeek">Tuần này</div>
      <div class="court-chip" id="chipNextWeek">Tuần sau</div>
      <div class="court-chip" id="chipPrevWeek">Tuần trước</div>
      <div class="court-chip" id="chipToday">Hôm nay</div>
    </div>

    <!-- PRIMARY ACTION -->
    <div class="action-group">
      <button id="btnFetch" class="btn-court-primary" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
        <span>Truy Vấn Lịch Học</span>
      </button>
    </div>

    <!-- RESULTS SECTION -->
    <div class="results-wrap">
      <div class="results-head">
        <span class="results-title" id="resultsTitle">Thời khóa biểu</span>
        <div class="results-actions">
          <button id="btnExportIcs" class="btn-mini" style="display:none;" title="Xuất file lịch cho Google / Apple Calendar">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Xuất .ics</span>
          </button>
          <button id="btnCopyJson" class="btn-mini" style="display:none;">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>Copy JSON</span>
          </button>
        </div>
      </div>
      <div id="resultsBox" class="results-container">
        <div class="empty-state">
          Đang kết nối phiên sinh viên...
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="https://ziet.dev" target="_blank" rel="noreferrer">ziet.dev</a>
      <span>·</span>
      <a href="https://m.me/ziet.cute" target="_blank" rel="noreferrer" class="btn-report-bug" title="Nhắn tin báo lỗi trực tiếp cho tác giả qua Facebook">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Báo lỗi qua Facebook</span>
      </a>
    </div>
    <button id="btnToggleWidget" class="btn-dock-toggle" title="Ẩn/Hiện widget dock trên trang">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="9" y1="3" x2="9" y2="21"></line>
      </svg>
      <span>Dock Widget</span>
    </button>
  </footer>

  <!-- MODULES CLEAN ARCHITECTURE -->
  <script src="../core/constants.js"></script>
  <script src="../core/crypto.js"></script>
  <script src="../core/ics.js"></script>
  <script src="../services/storage-service.js"></script>
  <script src="../services/auth-service.js"></script>
  <script src="../services/schedule-service.js"></script>
  <script src="../ui/theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
